name: CI

on:
  pull_request:
  push:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check setup script syntax
        run: bash -n setup_flux_stack.sh

      - name: Confirm no checkpoint files are committed
        run: |
          test -z "$(find . -type f -name '*.safetensors' -o -name '*.ckpt' -o -name '*.gguf' -o -name '*.bin' -o -name '*.pt' -o -name '*.pth')"

      - name: Confirm no media files are committed
        run: |
          test -z "$(find . -type f -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.mp4' -o -name '*.mov')"
