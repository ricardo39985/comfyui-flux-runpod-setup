name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check setup script syntax
        run: bash -n setup_flux_stack.sh

      - name: Confirm no large model files are committed
        run: |
          if find . -type f \( -name '*.safetensors' -o -name '*.ckpt' -o -name '*.gguf' -o -name '*.bin' -o -name '*.pt' -o -name '*.pth' \) | grep -q .; then
            echo 'Model/checkpoint file committed. Remove it.'
            exit 1
          fi

      - name: Confirm no common image/media files are committed
        run: |
          if find . -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.mp4' -o -name '*.mov' \) | grep -q .; then
            echo 'Generated/reference media file committed. Remove it.'
            exit 1
          fi
